on:
  workflow_dispatch:
  pull_request:

jobs:

  check-submodules:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Check submodules up to date
      run: |
        git submodule foreach git fetch -fup origin "+refs/heads/*:refs/remotes/origin/*"
        git submodule update --remote --recursive --init
        clean=$(git status --porcelain)
        if [ "${clean}" == "" ]
        then
          echo "Submodules are up to date."
        else
          echo "Submodules are not up to date:"
          echo "${clean}"
          exit 1
        fi


  build-and-run-native-monte-carlo:
    runs-on: ubuntu-latest
    needs: check-submodules

    strategy:
      matrix:
        M: [1, 100]
        S: [0, 1]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgsl-dev libblas-dev gcc make

    - name: Compile application natively
      run: |
        make local-build

    - name: Run application
      run: |
        ./demo-native-mc \
          -M ${{ matrix.M }} -S ${{ matrix.S }}
